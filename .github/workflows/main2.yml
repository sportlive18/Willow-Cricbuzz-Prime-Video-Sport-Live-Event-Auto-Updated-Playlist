name: Automated PrimeSport JSON Updater
on:
  schedule:
    - cron: '*/7 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  update-file:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure Git User
        run: |
          git config --global user.name "sportlive18"
          git config --global user.email "271363488+sportlive18@users.noreply.github.com"
      - name: Sync and Update Log
        run: |
          export TZ="Asia/Kolkata"
          git pull origin main --rebase
          curl -sS -o primesport.json "https://raw.githubusercontent.com/srhady/willow-event/refs/heads/main/primevideo_sports.json"
          curl -sS -L -o primesport.m3u "https://raw.githubusercontent.com/srhady/willow-event/refs/heads/main/primevideo_sports.m3u"
          echo "🚀 PrimeSport Synced | IST: $(date +'%Y-%m-%d %H:%M:%S') | ID: $RANDOM" >> primesport.txt
      - name: Commit and Push
        run: |
          export TZ="Asia/Kolkata"
          git add primesport.json primesport.m3u primesport.txt
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "PrimeSport Database Updated ✅ [$(date +'%d-%m-%Y %H:%M')]"
          git push origin main
